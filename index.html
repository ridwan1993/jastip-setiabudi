<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jastip Setiabudi → Cilejit</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f8f9fa; margin:0; padding:15px; }
    h1 { text-align:center; color:#333; }
    .product { background:white; padding:15px; margin:10px 0; border-radius:12px; box-shadow:0 2px 5px rgba(0,0,0,0.1); }
    img { width:100%; border-radius:8px; }
    h3 { margin:8px 0 4px; }
    p { margin:4px 0; color:#555; }
    .btn { display:inline-block; background:#25D366; color:white; padding:8px 12px; border-radius:8px; text-decoration:none; margin-top:8px; }
  </style>
</head>
<body>
  <h1>👜 Jastip Setiabudi → Cilejit</h1>
  <div id="list"></div>

  <script>
    const SHEET_URL = "https://script.google.com/macros/s/AKfycbxABCDEFG12345/exec"; // Ganti dengan URL Web App kamu

    async function loadData() {
      const res = await fetch(SHEET_URL);
      const data = await res.json();
      const container = document.getElementById('list');
      container.innerHTML = '';

      data.forEach(p => {
        const item = document.createElement('div');
        item.className = 'product';
        item.innerHTML = `
          <img src="${p["Gambar URL"]}" alt="${p["Nama Produk"]}">
          <h3>${p["Nama Produk"]}</h3>
          <p>Harga Toko: Rp${p["Harga Toko"]}</p>
          <p><b>Harga Jastip: Rp${p["Harga Jastip"]}</b></p>
          <a class="btn" href="${p["Link WhatsApp"]}">Order via WhatsApp</a>
        `;
        container.appendChild(item);
      });
    }

    loadData();
  </script>
</body>
</html>
